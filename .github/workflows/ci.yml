name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.13.0'
            testbench: '^10.0.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0.0'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Require matrix versions
        run: |
          composer require --no-update laravel/framework:"${{ matrix.laravel }}"
          composer require --no-update --dev orchestra/testbench:"${{ matrix.testbench }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Security audit
        run: composer audit

      - name: Run test suite
        run: vendor/bin/phpunit
